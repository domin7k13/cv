<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dominik Czirjak - CV</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #5f5f5a;
    --line: #e2e0da; --accent: #1f4e79; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ecebe6; --muted: #a3a29b;
      --line: #34332f; --accent: #8db8e0; --accent-text: #10202f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 48px; }
  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    justify-content: space-between; margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); }
  .sub a { color: inherit; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: 8px;
    text-decoration: none; font-weight: 600; border: 1px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { color: var(--accent); }
  .viewer {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; height: min(1200px, 130vw); min-height: 520px;
  }
  .viewer object { width: 100%; height: 100%; display: block; border: 0; }
  .fallback { padding: 24px; color: var(--muted); }
  @media (max-width: 640px) {
    .viewer { display: none; }
    .mobile-note { display: block; }
  }
  .mobile-note { display: none; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Dominik Czirjak</h1>
      <p class="sub">Business Generalist &middot; <a href="https://www.linkedin.com/in/czirjak">linkedin.com/in/czirjak</a></p>
    </div>
    <div class="actions">
      <a class="btn primary" href="Dominik_Czirjak_CV.pdf" download>Download CV (PDF)</a>
      <a class="btn ghost" href="Dominik_Czirjak_CV.pdf" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </header>
  <div class="viewer">
    <object data="Dominik_Czirjak_CV.pdf#view=FitH" type="application/pdf">
      <p class="fallback">Your browser can't show the PDF here. Use the download button above.</p>
    </object>
  </div>
  <p class="mobile-note">Tap "Open in new tab" to read the CV, or download it.</p>
</main>
</body>
</html>
